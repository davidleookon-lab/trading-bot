name: Claude Bot

on:
  schedule:
    # 7 Minuten nach jedem 4h-Kerzenschluss (UTC 0, 4, 8, 12, 16, 20 Uhr)
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # Knopf „Run workflow“ zum Testen

permissions:
  contents: write

concurrency:
  group: claude-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot-Lauf
        run: python bot.py run

      - name: Kontostand speichern
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Bot-Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
